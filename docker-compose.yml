version: '3.9'

services:
  server:
    build:
      context: ./server
    container_name: taskflow-server
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: http://localhost:5000/api
    container_name: taskflow-client
    ports:
      - '80:80'
    depends_on:
      - server
    restart: unless-stopped
